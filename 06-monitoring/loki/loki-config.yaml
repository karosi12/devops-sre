auth_enabled: false

server:
  http_listen_port: 3100

ingester:
  # Single-node: one instance in the ring, avoid "too many unhealthy instances"
  autoforget_unhealthy: true
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
      heartbeat_timeout: 1m
  chunk_idle_period: 5m
  chunk_retain_period: 30s

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper  # Updated to TSDB index type
      object_store: filesystem
      schema: v13  # Updated from v11 to v13 for Structured Metadata
      index:
        prefix: index_
        period: 24h

#storage_config:
#  tsdb:  # Updated to TSDB storage configuration
#    dir: /loki/data

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
  filesystem:
    directory: /loki/chunks

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 720h
  volume_enabled: true
  max_cache_freshness_per_query: 10m
  allow_structured_metadata: false  # Prevents schema validation errors

compactor:
  working_directory: /loki/compactor  # Fix missing `working_directory`

common:
  path_prefix: /loki  # Ensures valid storage paths
