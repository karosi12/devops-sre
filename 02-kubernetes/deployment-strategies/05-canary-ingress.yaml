# Canary (Ingress-weighted) — precise traffic split using NGINX Ingress canary annotations.
# Requires NGINX Ingress Controller installed in the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-api-stable
  labels:
    app: nodejs-api
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nodejs-api
      track: stable
  template:
    metadata:
      labels:
        app: nodejs-api
        track: stable
        version: v1
    spec:
      containers:
        - name: nodejs-api
          image: ghcr.io/karosi12/nodejs-api:v1
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-api-canary
  labels:
    app: nodejs-api
    track: canary
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nodejs-api
      track: canary
  template:
    metadata:
      labels:
        app: nodejs-api
        track: canary
        version: v2
    spec:
      containers:
        - name: nodejs-api
          image: ghcr.io/karosi12/nodejs-api:v2
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-api-stable
spec:
  selector:
    app: nodejs-api
    track: stable
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-api-canary
spec:
  selector:
    app: nodejs-api
    track: canary
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodejs-api-stable
  annotations:
    nginx.ingress.kubernetes.io/canary: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodejs-api-stable
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodejs-api-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodejs-api-canary
                port:
                  number: 3000
