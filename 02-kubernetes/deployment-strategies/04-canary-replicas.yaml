# Canary (replica-weighted) — route traffic proportionally via replica counts.
# Stable gets most traffic; canary gets a small slice. Increase canary replicas over time.
#
# Example ratio: stable=9, canary=1 → ~10% to new version (with random kube-proxy load balancing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-api-stable
  labels:
    app: nodejs-api
    track: stable
spec:
  replicas: 9
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nodejs-api
      track: stable
  template:
    metadata:
      labels:
        app: nodejs-api
        track: stable
        version: v1
    spec:
      containers:
        - name: nodejs-api
          image: ghcr.io/karosi12/nodejs-api:v1
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-api-canary
  labels:
    app: nodejs-api
    track: canary
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nodejs-api
      track: canary
  template:
    metadata:
      labels:
        app: nodejs-api
        track: canary
        version: v2
    spec:
      containers:
        - name: nodejs-api
          image: ghcr.io/karosi12/nodejs-api:v2
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-api-canary-svc
spec:
  selector:
    app: nodejs-api
  ports:
    - port: 3000
      targetPort: 3000
